<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>My Gallery</h1>
    <p>Meri khinchi hui photos ek jagah.</p>
    <nav id="filters" aria-label="Filter photos"></nav>
  </header>

  <main id="gallery" class="gallery"></main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-btn lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" aria-label="Previous">&#8249;</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" aria-label="Next">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
